services:
  postgres:
    image: postgres:16-alpine
    container_name: worldcup-atlas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: worldcup_atlas
      POSTGRES_USER: worldcup
      POSTGRES_PASSWORD: worldcup
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worldcup -d worldcup_atlas"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
